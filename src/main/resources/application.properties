spring.application.name=mapuescuela

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mapuescuela?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

flowable.url=${FLOWABLE_URL:http://localhost:8082/flowable-rest/service}
flowable.username=${FLOWABLE_USERNAME:rest-admin}
flowable.password=${FLOWABLE_PASSWORD:test}
flowable.process-definition-key=procesoVentaMapuescuelaV3

admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8